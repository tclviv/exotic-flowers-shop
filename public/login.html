<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід | Квіткова крамниця</title>

    <link rel="stylesheet" href="/css/style.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg,#ffe0ec,#fff5f8);
            font-family: Arial, sans-serif;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            background: #fff;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,.15);
        }

        .auth-title {
            text-align: center;
            margin-bottom: 25px;
            color: #d63384;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .auth-form input {
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        .auth-form button {
            background: #d63384;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: .3s;
        }

        .auth-form button:hover {
            background: #b8256c;
        }

        .auth-links {
            margin-top: 20px;
            text-align: center;
        }

        .auth-links a {
            color: #d63384;
            text-decoration: none;
            font-weight: bold;
        }

        .auth-links a:hover {
            text-decoration: underline;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="auth-container">

    <h1 class="auth-title">🌺 Вхід до магазину</h1>

    <form id="loginForm" class="auth-form">

        <input
                type="email"
                id="email"
                placeholder="Введіть email"
                required
        >

        <input
                type="password"
                id="password"
                placeholder="Введіть пароль"
                required
        >

        <button type="submit">
            Увійти
        </button>

    </form>

    <div id="message"></div>

    <div class="auth-links">
        Немає акаунта?
        <a href="register.html">Зареєструватися</a>
    </div>

    <div class="auth-links">
        <a href="index.html">← Повернутися до магазину</a>
    </div>

</div>

<script src="/js/auth.js"></script>

</body>
</html>
