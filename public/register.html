<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація | Квіткова крамниця</title>

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="auth-page">

    <div class="auth-card">

        <h2>🌸 Реєстрація покупця</h2>

        <form id="registerForm">

            <input
                type="text"
                id="username"
                placeholder="Логін"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Пароль"
                required
            >

            <button type="submit">
                Зареєструватися
            </button>

        </form>

        <p id="message"></p>

        <div class="auth-links">
            <a href="login.html">Уже є акаунт?</a>
            <a href="index.html">На головну</a>
        </div>

    </div>

</div>

<script src="/js/auth.js"></script>

</body>
</html>
